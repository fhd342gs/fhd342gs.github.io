  <div class="logo">
    {{ with $.Site.Params.Logo.logoText }}{{ . }}{{ else }}Terminal{{ end }}

{{ with $.Site.Language.Params.subtitle }}
<div class="site-subtitle">{{ . }}</div>
{{ end }}
