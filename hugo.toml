baseURL = "https://ioctl.lol/"
languageCode = "en-us"
title = "ioctl"
theme = "hugo-theme-terminal"
copyright = "ioctl"

[pagination]
  pagerSize = 10

[params]
  contentTypeName = "ctf"
  themeColor = "green"
  showMenuItems = 5
  showLanguageSelector = false
  fullWidthTheme = false
  centerTheme = true
  autoCover = true
  showLastUpdated = false
  description = "HTB & OffSec walkthroughs | Security research & notes"

[params.twitter]
  creator = ""
  site = ""

[taxonomies]
  tag = "tags"
  category = "categories"

[languages]
  [languages.en]
    languageName = "English"
    title = "ioctl"
    subtitle = "ウォークスルー · セキュリティ · ノート"
    owner = ""
    keywords = ""
    menuMore = "Show more"
    readMore = "Read more"
    readOtherPosts = "Read other posts"
    newerPosts = "Newer posts"
    olderPosts = "Older posts"
    missingContentMessage = "ENOENT: page not found..."
    missingBackButtonLabel = "Back to home page"

    [languages.en.params.logo]
      logoText = "~/ioctl $"
      logoHomeLink = "/"

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "home"
        name = "~"
        url = "/"
        weight = 1
      [[languages.en.menu.main]]
        identifier = "ctf"
        name = "CTF"
        url = "/ctf/"
        weight = 2
      [[languages.en.menu.main]]
        identifier = "research"
        name = "Research"
        url = "/research/"
        weight = 3
      [[languages.en.menu.main]]
        identifier = "tools"
        name = "Tools"
        url = "/tools/"
        weight = 4
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 5

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = true
    noClasses = false
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS"]
